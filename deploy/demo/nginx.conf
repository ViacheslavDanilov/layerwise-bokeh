worker_processes 1;
pid /tmp/layerwise-nginx.pid;
error_log stderr;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_max_body_size 16k;
    client_body_temp_path /tmp/layerwise-client;
    proxy_temp_path /tmp/layerwise-proxy;
    fastcgi_temp_path /tmp/layerwise-fastcgi;
    uwsgi_temp_path /tmp/layerwise-uwsgi;
    scgi_temp_path /tmp/layerwise-scgi;

    server {
        listen __PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;

        location /api/ {
            proxy_pass http://127.0.0.1:8765/;
            # The API disables buffering for NDJSON with X-Accel-Buffering.
            proxy_read_timeout 600s;
        }

        location / {
            proxy_pass http://127.0.0.1:3765;
        }
    }
}
