services:
  web:
    build: ./frontend
    image: layerwise-bokeh-web
    # Named outright so the container is layerwise-bokeh-web, not layerwise-bokeh-web-1.
    # There is one replica and there will be one. The project prefix stays because
    # container names are global to the daemon, and the lab machine will not be
    # running only this project.
    container_name: layerwise-bokeh-web
    ports:
    - "3000:3000"
    depends_on:
    - api

  api:
    # From the repository root, where uv.lock is. backend/Dockerfile.dockerignore keeps
    # the context to what the image copies.
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: layerwise-bokeh-api
    container_name: layerwise-bokeh-api
    ports:
    - "8000:8000"
    environment:
      LAYERWISE_BOKEH_DATA_ROOT: /data
    volumes:
    # The libraries are named separately from the root so that one library, such as
    # data/library_dev/da2-large, or a directory built elsewhere can be served; by default
    # they are data/library_dev. Inside the container they always land at /data/library,
    # which is where the api looks by default, so LAYERWISE_BOKEH_LIBRARY is a host-side
    # setting only.
    - ${LAYERWISE_BOKEH_LIBRARY:-${LAYERWISE_BOKEH_DATA_ROOT:-./backend/data}/library_dev}:/data/library:ro
    - ${LAYERWISE_BOKEH_DATA_ROOT:-./backend/data}/sequences:/data/sequences
