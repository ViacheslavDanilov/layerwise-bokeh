  </style>
  <div id="root" data-composition-id="intro" data-width="1920" data-height="1080">
    <div id="in-sheet">
      <div id="in-poster" data-hold>

      <div id="in-row">

  <script>
    (function () {
      // Frame 0 is the finished poster, and it holds until the voice starts at 2.0 s. Its lines then rise out
      // and one slide builds under the voice from the film's own data: All in focus, then Disparity with
      // "Distance of every pixel" (V1), Occlusion with "What the next frame hides" (V2), and the headline
      // (V3). A tile lands as the end card's lines do, rising 28 px with a blur-in; each line under it lands
      // word by word as a chapter headline does. The three loops share one clock from the scene's start, 0.2 s
      // into the loop, so they stay in step whenever a tile lands, and a cycle ends as the Occlusion tile lands
      // (7.3 s) and again under the whip (12.93 s), so that it arrives on the loop's first frame. All hold until
      // the sheet carrying them whips off to the left at 12.6 s, onto the app already on screen.
      const tl = gsap.timeline({ paused: true });
      const out = (target, t) => tl.to(target, { y: -28, opacity: 0, filter: "blur(8px)", duration: 0.6, ease: "power2.inOut" }, t);
      out("#in-brand", 2.0);
      out("#in-subtitle", 2.3);
      const rise = (card, t) => tl.fromTo(card, { y: 28, opacity: 0, filter: "blur(8px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, t);
      const land = (line, t, gap) => document.querySelectorAll(line + " .in-w").forEach((w, i) => {
        tl.fromTo(w, { opacity: 0, filter: "blur(8px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, t + i * gap);
      });
      rise("#in-c1", 2.7);
      land("#in-c1 .in-label", 3.1, 0.16);
      rise("#in-c2", 3.65);
      land("#in-c2 .in-label", 4.3, 0.16);
      rise("#in-c3", 7.3);
      land("#in-c3 .in-label", 7.7, 0.16);
      land("#in-head", 10.2, 0.16);
      tl.to("#in-sheet", { x: -2050, duration: 0.45, ease: "power3.inOut" }, 12.6);
      tl.to("#in-sheet", { filter: "blur(10px)", duration: 0.22, ease: "power2.in" }, 12.6);
      window.__timelines["intro"] = tl;
    })();
  </script>
